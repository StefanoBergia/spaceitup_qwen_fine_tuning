[project]
name = "rover-vlm"
version = "0.1.0"
description = "Fine-tuning Qwen3.5-2B to predict trajectories/waypoints from a single RGB image (SPACEITUP rover path VLM)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # torch pinned to 2.10 so the prebuilt causal-conv1d wheel (cu12torch2.10) matches;
    # bump both together when Dao-AILab publishes wheels for newer torch.
    "torch==2.10.0",
    "torchvision==0.25.0",
    # Fast kernels for Qwen3.5's linear-attention layers (transformers uses them if importable)
    "flash-linear-attention>=0.5.1",
    "causal-conv1d",
    "transformers>=5.14",
    "peft>=0.17",
    "accelerate>=1.2",
    "huggingface-hub[hf_transfer]>=0.30",
    "pillow>=10.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

# Use uv-managed Python (lives on NFS, ships its own C headers): the system
# python3.12 on the login node has dev headers but thor's doesn't, which breaks
# Triton's runtime JIT (fatal error: Python.h not found).
[tool.uv]
python-preference = "only-managed"

# thor's driver is 570.158.01 (CUDA 12.8) — default PyPI torch 2.13 ships CUDA 13 wheels
# which need driver >= 580, so pin torch to the cu128 wheel index.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.2.post1/causal_conv1d-1.6.2.post1+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rover_vlm"]
